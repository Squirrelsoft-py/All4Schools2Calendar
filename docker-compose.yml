services:
  # Keeps the calendar up to date, every a4s.refresh minutes
  scheduler:
    image: all4schools2calendar:latest
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Berlin
    command: ["scheduler.py"]

  # Syncs once and exits. Start it with:
  #   docker compose --profile tools run --rm sync
  sync:
    image: all4schools2calendar:latest
    build: .
    restart: "no"
    env_file:
      - .env
    environment:
      TZ: Europe/Berlin
    command: ["a4s_main_caldav.py"]
    profiles:
      - tools

networks: {}
